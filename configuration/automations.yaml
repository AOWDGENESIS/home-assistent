# Automationen für Home Assistant

automation:
  - alias: Licht an bei Sonnenuntergang
    trigger:
      - platform: sun
        event: sunset
    action:
      - service: light.turn_on
        target:
          entity_id: light.livingroom

  - alias: Temperaturwarnung
    trigger:
      - platform: numeric_state
        entity_id: sensor.temperature
        above: 28
    action:
      - service: notify.mobile_app
        data:
          message: "Achtung! Die Temperatur ist über 28°C gestiegen."
