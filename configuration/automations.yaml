# Automationen für Home Assistant

automation:
  - alias: Licht an bei Sonnenuntergang
    trigger:
      - platform: sun
        event: sunset
    action:
      - service: light.turn_on
        target:
          entity_id: light.wohnzimmer

  - alias: Temperaturwarnung
    trigger:
      - platform: numeric_state
        entity_id: sensor.temp
        above: 28
    action:
      - service: notify.notify
        data:
          message: "Temperatur über 28°C!"
