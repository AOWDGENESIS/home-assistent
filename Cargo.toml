[workspace]
members = ["ur-core", "ur-cli", "ur-recovery", "ur-device-broker"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AOWDGENESIS <aowdgenesis@example.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/AOWDGENESIS/home-assistent"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.5"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1
